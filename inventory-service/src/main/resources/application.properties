spring.application.name=inventory-service

spring.datasource.url=jdbc:postgresql://localhost:5433/inventory_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate

spring.grpc.server.port=9090

# add consumer config
# pada auto-offset-rest ada 2 pilihan:
# 1. earliest: mulai dari pesan paling awal yang masih tersimpan.
# 2. latest (default Kafka): mulai dari pesan yang datang setelah consumer menyala. Pesan lama dilewati.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.mdn.management.inventory.product.OrderCreatedEvent
spring.kafka.consumer.properties[spring.json.use.type.headers]=false